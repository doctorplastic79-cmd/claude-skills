# Aggiorna l'app pubblicata quando karaoke-studio/ cambia su main.
# L'app è servita da GitHub Pages dal branch gh-pages:
#   https://doctorplastic79-cmd.github.io/claude-skills/
name: Pubblica Karaoke Studio

on:
  push:
    branches: [main]
    paths: ["karaoke-studio/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copia l'app sul branch gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add /tmp/site gh-pages
          rsync -a --delete --exclude .git karaoke-studio/ /tmp/site/
          touch /tmp/site/.nojekyll
          cd /tmp/site
          git add -A
          git diff --cached --quiet || git commit -m "Aggiorna Karaoke Studio da main"
          git push origin HEAD:gh-pages
